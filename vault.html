<!doctype html>
<!--
  Link Gen Tool - shared credential vault
  This page is loaded in a hidden <iframe> by link-gen-tool.js, always from
  THIS SAME origin (the tool's GitHub Pages site), no matter which brand
  page embeds the tool. That makes localStorage here shared across every
  brand, which is the whole point: one saved test user/pass pair works
  everywhere.

  Protocol (postMessage, JSON body):
    -> {type:'lgt-vault-get'}
    <- {type:'lgt-vault-data', credentials:[{id,label,username,password,isDefault}]}
    -> {type:'lgt-vault-save', credential:{label,username,password}}       (adds new; first ever = default)
    <- {type:'lgt-vault-data', credentials:[...]}
    -> {type:'lgt-vault-set-default', id}
    <- {type:'lgt-vault-data', credentials:[...]}
    -> {type:'lgt-vault-delete', id}
    <- {type:'lgt-vault-data', credentials:[...]}

  No UI here on purpose - it's a headless relay iframe. The management UI
  lives in the panel (link-gen-tool.js), which just talks to this page.
-->
<html>
<head><meta charset="utf-8"><title>Link Gen Tool Vault</title></head>
<body>
<script>
(function () {
  var STORAGE_KEY = 'lgt-credentials-v1';

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function save(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function uid() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function reply(source, origin, list) {
    source.postMessage({ type: 'lgt-vault-data', credentials: list }, origin);
  }

  window.addEventListener('message', function (ev) {
    var msg = ev.data;
    if (!msg || typeof msg !== 'object') return;

    var list = load();

    switch (msg.type) {
      case 'lgt-vault-get':
        reply(ev.source, ev.origin, list);
        break;

      case 'lgt-vault-save': {
        var cred = msg.credential || {};
        var entry = {
          id: uid(),
          label: cred.label || cred.username || 'credential',
          username: cred.username || '',
          password: cred.password || '',
          isDefault: list.length === 0 // first ever saved credential becomes default automatically
        };
        list.push(entry);
        save(list);
        reply(ev.source, ev.origin, list);
        break;
      }

      case 'lgt-vault-set-default': {
        list = list.map(function (c) {
          return Object.assign({}, c, { isDefault: c.id === msg.id });
        });
        save(list);
        reply(ev.source, ev.origin, list);
        break;
      }

      case 'lgt-vault-delete': {
        var wasDefault = list.some(function (c) { return c.id === msg.id && c.isDefault; });
        list = list.filter(function (c) { return c.id !== msg.id; });
        if (wasDefault && list.length > 0) list[0].isDefault = true; // keep automation unblocked
        save(list);
        reply(ev.source, ev.origin, list);
        break;
      }
    }
  });
})();
</script>
</body>
</html>
