name: Package Chrome extension

# Zips the extension/ folder and publishes it as a GitHub Release asset on
# every push to main that touches the extension - matches the user's
# existing "receive addons as a ZIP" installation habit, rather than
# requiring a git clone + manual folder navigation to load unpacked.
on:
  push:
    branches: ["main"]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip extension folder
        run: |
          cd extension
          zip -r ../link-gen-tool-extension.zip .

      - name: Publish/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extension-latest
          name: Link Gen Tool extension (latest)
          body: |
            Auto-built from the latest commit on `main`. Always reflects the
            current extension source - re-download whenever there's a new
            update to pick up the latest fixes.

            **Install:**
            1. Download `link-gen-tool-extension.zip` below and extract it.
            2. Open `chrome://extensions` in Chrome.
            3. Enable "Developer mode" (top-right toggle).
            4. Click "Load unpacked" and select the extracted folder.
            5. Click the extension's toolbar icon on any page to toggle the panel.
          files: link-gen-tool-extension.zip
          make_latest: true
